var myMap = ixmaps.Map("map", {
        mapType: "VT_TONER_LITE",
        mode:    "info",
        legend:  "open",
        tools:   true
    })
    .view({ center: { lat: 42.3, lng: 12.6 }, zoom: 6 })
    .options({
        objectscaling:  "dynamic",
        normalSizeScale: "8000000",
        basemapopacity: 0.5,
        flushChartDraw: 1000000
    });

// FEATURE base: geometry for the 110 capoluoghi (pre-filtered GeoJSON, inlined)
myMap.layer("comuni")
    .data({ obj: CAPOLUOGHI_GEO, type: "geojson" })
    .binding({ geo: "geometry", id: "com_istat_code_num", title: "name" })
    .type("FEATURE")
    .style({
        colorscheme: ["#e6e6e6"],
        fillopacity: 0.4,
        linecolor: "#999999",
        linewidth: 0.5,
        showdata: "true"
    })
    .define();

// THEME 1 - CHOROPLETH: unsealed land per capita (situation)
// same layer name "comuni" -> joins onto the FEATURE base geometry
myMap.layer("comuni")
    .data({ obj: CAPOLUOGHI_DATA, type: "json" })
    .binding({ lookup: "pro_com", value: "suolo_non_sigillato_mq_procapite", title: "comune" })
    .type("CHOROPLETH|QUANTILE")
    .style({
        colorscheme: ["5", "#b10026", "#1a9850"],
        fillopacity: 0.85,
        linecolor: "#ffffff",
        linewidth: 0.7,
        valuedecimals: 0,
        units: " mq/ab",
        showdata: "true",
        name: "suolo-procapite-choropleth"
    })
    .meta({
        name: "suolo-procapite-choropleth",
        tooltip:
            "<b>{{comune}}</b> ({{provincia}}, {{regione}})<br>" +
            "<hr style='margin:4px 0;border-color:#ddd'>" +
            "<b>Suolo non sigillato pro capite:</b> {{suolo_non_sigillato_mq_procapite}} m\u00b2/ab<br>" +
            "Popolazione (1\u00b0 gen. 2026, stima ISTAT): {{popolazione_2026}}<br>" +
            "Superficie comunale: {{area_ha}} ha \u2014 Suolo non sigillato: {{suolo_non_sigillato_ha}} ha<br>" +
            "Suolo consumato totale 2024: {{suolo_consumato_totale_ha_2024}} ha ({{suolo_consumato_pct_2024}}%)<br>" +
            "<hr style='margin:4px 0;border-color:#ddd'>" +
            "<b>Ritmo di consumo di suolo:</b> {{ritmo_recente_ha_anno}} ha/anno (2018\u20132024) " +
            "vs {{ritmo_storico_ha_anno}} ha/anno (2006\u20132024 medio)<br>" +
            "Variazione del ritmo: <b>{{variazione_ritmo_pct}}%</b>",
        snippet: "Suolo non sigillato per abitante (m\u00b2/ab, scelta cromatica) e variazione % del ritmo di consumo di suolo (frecce)",
        description:
            "<b>Colore</b> \u2014 metri quadrati di suolo non sigillato (superficie comunale meno suolo consumato 2024) per abitante: " +
            "rosso = poco spazio libero per persona, verde = molto. " +
            "<b>Frecce</b> \u2014 confrontano il ritmo recente di consumo di suolo (2018\u20132024, ettari/anno) con la media storica " +
            "(2006\u20132024): freccia verso il basso = il consumo sta accelerando rispetto alla media storica (il verde si riduce), verso l'alto = sta rallentando. " +
            "La dimensione della freccia riflette l'intensit\u00e0 della variazione." +
            "<div style='margin-top:0.6em;padding-top:0.5em;border-top:1px solid #e5e5e5;font-size:0.8em;color:#888'>" +
            "Fonte: ISPRA/SNPA, Consumo di suolo \u2013 Edizione 2025 (dati 2006\u20132024); " +
            "ISTAT, Popolazione residente comunale (stima 1\u00b0 gennaio 2026); " +
            "superficie comunale calcolata dalla geometria ISTAT (EPSG:3035)</div>"
    })
    .title("Suolo non sigillato pro capite e ritmo di consumo")
    .define();

// THEME 2 - POINTER (arrowChart): % change in soil-sealing pace, up = accelerating, down = decelerating
myMap.layer("ritmo-pointer")
    .data({ obj: CAPOLUOGHI_DATA, type: "json" })
    .binding({ geo: "lat|lon", value: "variazione_ritmo_pct", title: "comune" })
    .type("CHART|USER|VALUES|NOLEGEND")
    .style({
        userdraw: "arrowChartInv",
        colorscheme: ["#4a4a4a"],
        normalsizevalue: "60",
        scale: 0.5,
        rangescale: 1,
        valuedecimals: 0,
        units: "%",
        showdata: "true",
        name: "ritmo-pointer"
    })
    .meta({
        name: "ritmo-pointer",
        tooltip:
            "<b>{{comune}}</b><br>" +
            "Ritmo recente: {{ritmo_recente_ha_anno}} ha/anno (2018\u20132024)<br>" +
            "Ritmo storico: {{ritmo_storico_ha_anno}} ha/anno (2006\u20132024 medio)<br>" +
            "Variazione: <b>{{variazione_ritmo_pct}}%</b>"
    })
    .define();
